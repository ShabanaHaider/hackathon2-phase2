kafka:
  replicaCount: 1

  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT

  auth:
    enabled: false

  persistence:
    enabled: true
    size: 8Gi

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  config:
    auto.create.topics.enable: true
    default.replication.factor: 1
    min.insync.replicas: 1
    offsets.topic.replication.factor: 1

  service:
    type: ClusterIP
    ports:
      client: 9092

zookeeper:
  enabled: true
  replicaCount: 1
  persistence:
    enabled: true
    size: 8Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
