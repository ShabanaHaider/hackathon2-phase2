replicaCount: 1

image:
  repository: notification-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8001

dapr:
  enabled: true
  appId: notification-service
  appPort: 8001

env:
  DAPR_HTTP_PORT: "3500"
  PUBSUB_NAME: "pubsub-kafka"

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 150m
    memory: 128Mi
