replicaCount: 1

image:
  repository: recurring-task-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8002

dapr:
  enabled: true
  appId: recurring-task-service
  appPort: 8002

env:
  DAPR_HTTP_PORT: "3500"
  PUBSUB_NAME: "pubsub-kafka"
  BACKEND_URL: "http://todo-backend:8000"

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 150m
    memory: 128Mi
