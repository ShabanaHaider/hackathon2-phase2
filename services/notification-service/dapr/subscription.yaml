apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: notification-reminders-sub
scopes:
- notification-service
spec:
  pubsubname: pubsub-kafka
  topic: reminders
  routes:
    default: /events/reminder-due
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: notification-notifications-sub
scopes:
- notification-service
spec:
  pubsubname: pubsub-kafka
  topic: notifications
  routes:
    default: /events/notification
